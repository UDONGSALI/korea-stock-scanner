name: Cosmetics Stage Performance

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cosmetics_performance.yml"

permissions:
  contents: write

jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate cosmetics performance
        run: |
          python - <<'PY'
          import csv
          import gzip
          import json
          from pathlib import Path

          tickers = {"161890", "192820", "241710", "483650", "257720", "090430"}
          stage_path = Path("data/history_signals.json")
          data = json.loads(stage_path.read_text(encoding="utf-8"))

          events = []
          for stage, key in [("EARLY_LEADER", "early_leader_events"), ("LEADER", "leader_events"), ("SETUP", "setup_events"), ("BUY", "signals")]:
              for row in data.get(key, []):
                  if row.get("ticker") in tickers:
                      events.append({
                          "date": row["date"],
                          "ticker": row["ticker"],
                          "name": row["name"],
                          "stage": stage,
                          "event_close": float(row["close"]),
                          "market_alignment": row.get("market_alignment"),
                      })

          dates_needed = set()
          for path in Path("data/snapshots").glob("*.csv.gz"):
              date = path.name.removesuffix(".csv.gz")
              if "2026-08-01" <= date <= "2026-08-27":
                  dates_needed.add(date)

          prices = {ticker: {} for ticker in tickers}
          for date in sorted(dates_needed):
              path = Path("data/snapshots") / f"{date}.csv.gz"
              with gzip.open(path, "rt", encoding="utf-8-sig", newline="") as file:
                  reader = csv.DictReader(file)
                  for row in reader:
                      ticker = row["ticker"]
                      if ticker in tickers:
                          prices[ticker][date] = float(row["close"])

          latest_date = "2026-08-27"
          records = []
          for event in sorted(events, key=lambda x: (x["ticker"], x["date"], x["stage"])):
              series = [(date, close) for date, close in sorted(prices[event["ticker"]].items()) if event["date"] <= date <= latest_date]
              if not series:
                  continue
              latest_close = series[-1][1]
              max_close = max(close for _, close in series)
              min_close = min(close for _, close in series)
              event_close = event["event_close"]
              record = dict(event)
              record.update({
                  "latest_date": latest_date,
                  "latest_close": latest_close,
                  "return_pct": (latest_close / event_close - 1) * 100,
                  "max_return_pct": (max_close / event_close - 1) * 100,
                  "max_drawdown_from_event_pct": (min_close / event_close - 1) * 100,
                  "trading_days": len(series) - 1,
              })
              records.append(record)

          first_by_stage = []
          seen = set()
          for record in sorted(records, key=lambda x: (x["ticker"], x["stage"], x["date"])):
              key = (record["ticker"], record["stage"])
              if key not in seen:
                  seen.add(key)
                  first_by_stage.append(record)

          buy_records = [row for row in records if row["stage"] == "BUY"]
          first_buy = []
          seen_ticker = set()
          for row in sorted(buy_records, key=lambda x: (x["ticker"], x["date"])):
              if row["ticker"] not in seen_ticker:
                  seen_ticker.add(row["ticker"])
                  first_buy.append(row)

          output = {
              "from_date": "2026-08-01",
              "to_date": latest_date,
              "all_stage_events": records,
              "first_event_by_stage": first_by_stage,
              "first_buy_by_ticker": first_buy,
          }
          Path("data/cosmetics_performance.json").write_text(json.dumps(output, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: Commit performance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cosmetics_performance.json
          git commit -m "data: calculate cosmetics stage performance"
          git push
