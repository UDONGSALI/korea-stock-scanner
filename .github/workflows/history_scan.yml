name: Historical Kangto Scan

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/history_scan.yml"

permissions:
  contents: write

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Re-scan Kangto signals
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TZ: Asia/Seoul
        run: python src/history_scan.py --from-date 2026-08-17 --to-date 2026-08-27

      - name: Commit history result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history_signals.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "data: rescan Kangto signals from 2026-08-17"
          git push
