name: Analyze 0828 vs 0904 Once

on:
  push:
    paths:
      - ".github/workflows/analyze_0828_0904_once.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Compare cohorts
        run: python src/analyze_0828_vs_0904.py

      - name: Commit comparison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/compare_2026-08-28_vs_2026-09-04.json
          git commit -m "analysis: compare 0828 and 0904 BUY cohorts" || exit 0
          git push

# rerun after NaN normalization
