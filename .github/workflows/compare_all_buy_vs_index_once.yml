name: Compare All BUY vs Indices Once

on:
  push:
    paths:
      - ".github/workflows/compare_all_buy_vs_index_once.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compare all BUYs to matched indices
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TZ: Asia/Seoul
        run: python src/analyze_all_buy_vs_index_20261007.py
      - name: Save analysis results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/all_buy_vs_index_20261007.json data/all_buy_vs_index_20261007.csv
          git commit -m "analysis: save all-BUY index-relative return" || exit 0
          git push
