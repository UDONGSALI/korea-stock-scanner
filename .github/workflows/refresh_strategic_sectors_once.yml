name: Refresh Strategic Sectors Once

on:
  push:
    paths:
      - ".github/workflows/refresh_strategic_sectors_once.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Refresh strategic sector map
        run: python src/update_strategic_sector_map.py

      - name: Re-rank captured BUYs
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TZ: Asia/Seoul
        run: python src/apply_buy_ranking.py

      - name: Re-rank all active BUYs
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TZ: Asia/Seoul
        run: python src/export_current_buy_priority.py

      - name: Export BUY tracking CSV
        run: python src/export_buy_tracking_csv.py

      - name: Commit refreshed sector ranking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: refresh strategic sector ranking" || exit 0
          git push
