name: Pullback Entry Audit

on:
  push:
    branches: [analysis/pullback-entry-20261008-1724]
    paths: [src/analyze_pullback.py, .github/workflows/analyze_pullback_once.yml]

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pandas==2.3.3' 'numpy>=2.0'
      - name: Validate historical no-trade rows and replay
        run: |
          python - <<'PY'
          from pathlib import Path
          code = Path('src/analyze_pullback.py').read_text()
          old = "    assert invalid_ohlc.empty, f'invalid OHLC: {len(invalid_ohlc)}'"
          new = "    assert all(r['volume'] == 0 and r['open'] == 0 and r['high'] == 0 and r['low'] == 0 and r['date_text'] < min(c['capture_date'] for c in captures if c['ticker'] == r['ticker']) for r in invalid_ohlc.to_dict('records')), 'invalid tradable OHLC or no-trade bar inside live position'"
          assert old in code
          Path('src/analyze_pullback_checked.py').write_text(code.replace(old, new))
          PY
          python -m py_compile src/analyze_pullback_checked.py
          python src/analyze_pullback_checked.py
      - name: Save report on analysis branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pullback_analysis_20261007 src/analyze_pullback_checked.py
          if ! git diff --cached --quiet; then
            git commit -m 'analysis: validated pullback entry historical results'
            git push origin HEAD:analysis/pullback-entry-20261008-1724
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pullback-entry-20261007
          path: |
            data/pullback_analysis_20261007/
            src/analyze_pullback_checked.py
          retention-days: 30
