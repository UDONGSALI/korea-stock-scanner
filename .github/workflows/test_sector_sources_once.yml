name: Test Sector Sources Once

on:
  push:
    paths:
      - ".github/workflows/test_sector_sources_once.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Test sector sources
        run: python src/test_sector_sources.py

      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wiseindex_sector_test.json
          git commit -m "test: record sector source probe" || exit 0
          git push
