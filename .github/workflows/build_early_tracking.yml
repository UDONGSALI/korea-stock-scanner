name: Build EARLY Tracking

# rebuild: export csv
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build_early_tracking.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build EARLY tracking
        run: python src/early_state.py

      - name: Export EARLY tracking CSV
        run: python src/export_early_tracking_csv.py

      - name: Commit tracking data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/early_tracking.json data/early_tracking.csv data/early_registry.csv data/latest.json data/tracking.json data/captures.csv data/history_signals.json data/results
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "data: build EARLY lifecycle tracking"
          git push
