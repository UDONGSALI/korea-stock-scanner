name: Daily KRX Scan

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/scan.yml"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Aug 24-27 backfill
        run: python src/week_backfill.py --from-date 2026-08-24 --to-date 2026-08-27 --prefix week_0824_0827

      - name: Commit backfill
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/week_0824_0827_buy.csv data/week_0824_0827_early.csv
          git commit -m "data: backfill Aug 24-27 tracking"
          git push
