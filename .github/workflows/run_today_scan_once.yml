name: Run Missed KRX Scan Once

on:
  push:
    paths:
      - ".github/workflows/run_today_scan_once.yml"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run scanner
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TZ: Asia/Seoul
        run: python src/scanner.py

      - name: Rank BUY candidates
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TZ: Asia/Seoul
        run: python src/apply_buy_ranking.py

      - name: Apply Kangto exit rules
        run: python src/apply_exit_rules.py

      - name: Rank all active BUY candidates now
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TZ: Asia/Seoul
        run: python src/export_current_buy_priority.py

      - name: Enrich post-EARLY state
        run: python src/early_state.py

      - name: Export BUY tracking CSV
        run: python src/export_buy_tracking_csv.py

      - name: Export EARLY tracking CSV
        run: python src/export_early_tracking_csv.py

      - name: Export confirmed EOD sheet snapshots
        run: python src/export_sheet_snapshot.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "data: recover missed KRX scan $(TZ=Asia/Seoul date +'%Y-%m-%d')"
          git push
