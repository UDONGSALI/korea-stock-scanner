name: Validate Kangto Core V3

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/validate_v3.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run daily scanner
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TZ: Asia/Seoul
        run: python src/scanner.py

      - name: Run August history scan
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TZ: Asia/Seoul
        run: python src/history_scan.py --from-date 2026-08-01 --to-date 2026-08-27

      - name: Diagnose cosmetics
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TZ: Asia/Seoul
        run: python src/diagnose.py --tickers 161890,192820,241710,483650,257720,090430 --from-date 2026-08-01 --to-date 2026-08-27 --output data/diagnostics_v3.json

      - name: Commit validation data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "data: validate kangto core v3"
          git push
