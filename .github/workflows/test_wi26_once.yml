name: Test WI26 Once

on:
  push:
    paths:
      - ".github/workflows/test_wi26_once.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python src/test_sector_sources.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wiseindex_sector_test.json
          git commit -m "test: record WI26 probe" || exit 0
          git push
