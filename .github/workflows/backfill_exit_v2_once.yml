name: Backfill Exit V2 Once

on:
  push:
    paths:
      - ".github/workflows/backfill_exit_v2_once.yml"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch scanner risk fields to fixed 8 percent stop
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/scanner.py")
          text = path.read_text(encoding="utf-8")
          old = '''def calculateRiskFields(selected: pd.DataFrame, config: dict) -> pd.DataFrame:
              selected = selected.copy()
              selected["stop_price"] = selected["base_low"]
              selected["risk_per_share"] = selected["close"] - selected["stop_price"]
              selected["stop_distance_pct"] = selected["risk_per_share"] / selected["close"] * 100
              selected["three_r_target"] = selected["close"] + selected["risk_per_share"] * config["risk"]["reward_multiple"]
              selected["max_position_pct_for_risk"] = np.where(
                  selected["stop_distance_pct"] > 0,
                  np.minimum(100.0, config["risk"]["max_account_risk_pct"] / selected["stop_distance_pct"] * 100),
                  np.nan,
              )
              return selected
          '''
          new = '''def calculateRiskFields(selected: pd.DataFrame, config: dict) -> pd.DataFrame:
              selected = selected.copy()
              initial_stop_pct = float(config["exit"].get("initial_stop_pct", 8.0))
              selected["stop_price"] = selected["close"] * (1 - initial_stop_pct / 100)
              selected["risk_per_share"] = selected["close"] - selected["stop_price"]
              selected["stop_distance_pct"] = selected["risk_per_share"] / selected["close"] * 100
              selected["three_r_target"] = selected["close"] + selected["risk_per_share"] * config["risk"]["reward_multiple"]
              selected["max_position_pct_for_risk"] = np.where(
                  selected["stop_distance_pct"] > 0,
                  np.minimum(100.0, config["risk"]["max_account_risk_pct"] / selected["stop_distance_pct"] * 100),
                  np.nan,
              )
              return selected
          '''
          if old not in text:
              raise RuntimeError("calculateRiskFields 원본 블록을 찾지 못했습니다.")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Backfill exit tracking
        run: python src/apply_exit_rules.py

      - name: Refresh EARLY state
        run: python src/early_state.py

      - name: Export BUY tracking CSV
        run: python src/export_buy_tracking_csv.py

      - name: Export EARLY tracking CSV
        run: python src/export_early_tracking_csv.py

      - name: Export confirmed EOD sheet snapshots
        run: python src/export_sheet_snapshot.py

      - name: Commit v2 rule and backfill
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scanner.py data/tracking.json data/buy_tracking.csv data/early_tracking.csv data/sheet_buy_tracking.csv data/sheet_early_tracking.csv
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "data: backfill close-confirmed 8pct exit rules"
          git push
