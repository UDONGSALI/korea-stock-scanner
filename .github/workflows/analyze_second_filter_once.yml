name: Analyze Second Filter After EARLY15 Once

on:
  push:
    paths:
      - ".github/workflows/analyze_second_filter_once.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas

      - name: Analyze second filter combos
        run: python src/analyze_second_filter_combos.py

      - name: Commit analysis output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/second_filter_combo_summary.json
          git commit -m "analysis: evaluate second BUY filter combos" || exit 0
          git push
