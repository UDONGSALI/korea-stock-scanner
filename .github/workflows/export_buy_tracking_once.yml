name: Export BUY Tracking Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/export_buy_tracking_once.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export BUY tracking CSV
        run: python src/export_buy_tracking_csv.py
      - name: Commit CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/buy_tracking.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: export BUY tracking CSV"
          git push
