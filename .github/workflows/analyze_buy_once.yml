name: Analyze BUY vs Benchmark Once

on:
  push:
    paths:
      - ".github/workflows/analyze_buy_once.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Analyze BUY signals vs benchmarks
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TZ: Asia/Seoul
        run: python src/analyze_buy_vs_benchmark.py

      - name: Commit analysis output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/buy_vs_benchmark_analysis.json data/buy_vs_benchmark_daily.csv data/buy_vs_benchmark_trades.csv
          git commit -m "analysis: compare BUY signals with benchmarks" || exit 0
          git push
