name: Analyze 0828 vs 0904 Once

on:
  push:
    paths:
      - ".github/workflows/analyze_0828_0904_once.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build compact comparison
        run: python src/compact_0828_0904.py

      - name: Commit compact comparison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/compare_2026-08-28_vs_2026-09-04_summary.json
          git commit -m "analysis: add compact 0828 vs 0904 comparison" || exit 0
          git push
